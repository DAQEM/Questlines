plugins {
    id "com.github.johnrengelman.shadow"
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    mods {
        forge {
            sourceSet project(":neoforge").sourceSets.main
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

configurations {
    common
    forgeLike
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    implementation(project(path: ":neoforge", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    common(project(path: ":testmod-common", configuration: "namedElements")) { transitive false }

    modRuntimeOnly "com.daqem.yamlconfig:yamlconfig-neoforge:${project.config_library_version}"
    modRuntimeOnly "com.daqem.uilib:uilib-neoforge:${project.ui_library_version}"
    modRuntimeOnly "com.daqem.arc:arc-neoforge:${project.arc_version}"

    modRuntimeOnly "dev.architectury:architectury-neoforge:${project.architectury_version}"
}
