loom {
    accessWidenerPath = project(':common').file("src/main/resources/questlines.accessWidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation project(path: ":common", configuration: "namedElements")

    modRuntimeOnly "com.daqem.uilib:uilib-common:${project.ui_library_version}"
    modRuntimeOnly "com.daqem.yamlconfig:yamlconfig-common:${project.config_library_version}"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}
